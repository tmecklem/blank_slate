; Services a bare (VM-native) drop runs on every boot. Citrus starts
; supervisord against this file during drop provisioning, after the workspace
; and credentials are in place. One-time work belongs in .launchbox/vm.json's
; "setup" instead — it is baked into the snapshot and never re-run here.

[supervisord]
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
; A snapshot restore hands back a warm disk with every process dead, so clear
; any stale postmaster pid before starting. /run is tmpfs, so the socket
; directory setup created is gone by the time the restored VM boots and has to
; be recreated — as root, since /run itself is root-owned, which is why the
; program drops to postgres at exec rather than through supervisord's `user=`.
command=/bin/sh -c 'install -d -o postgres -g postgres -m 2775 /var/run/postgresql; rm -f /var/lib/postgresql/17/main/postmaster.pid; exec setpriv --reuid=postgres --regid=postgres --init-groups /usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/17/main -c config_file=/etc/postgresql/17/main/postgresql.conf'
autorestart=true
priority=10
stdout_logfile=/var/log/postgresql.log
redirect_stderr=true
